# Git credentials for the local Argo CD, copied from the secret gitops-repo-credentials
# in the policy namespace on the hub (hub template, encrypted in the replicated policy).
# Not needed for a public repository, so it is commented out and not listed in
# policy-generator.yaml. To use it, remove the comments and add the file to the manifests list.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: repo-cluster-config
#   namespace: openshift-gitops
#   labels:
#     argocd.argoproj.io/secret-type: repository
# type: Opaque
# data: '{{hub copySecretData "acm-policies" "gitops-repo-credentials" hub}}'
